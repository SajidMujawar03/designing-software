# Packaging (pnpm --filter @figma/desktop dist). Build the web app first: it is bundled as a resource.
appId: com.sajidmujawar.designclone
productName: Design Clone
copyright: Copyright © 2026 Sajid Mujawar

directories:
  output: release
  buildResources: build

# The main process and preload are bundled by build.mjs (everything they need is inside), so no node_modules ship.
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../web/dist
    to: web
asar: true
npmRebuild: false

fileAssociations:
  - ext: design
    name: Design Clone file
    description: Design file
    role: Editor
    mimeType: application/x-design-clone
protocols:
  - name: Design Clone link
    schemes: [design-clone]

# Locks down what the packaged app can be made to do.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Design Clone
  artifactName: Design-Clone-Setup-${version}.${ext}
portable:
  artifactName: Design-Clone-${version}-portable.${ext}

# macOS: signed and notarized when the release workflow has Apple credentials
# (MAC_CERTIFICATE, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID); unsigned otherwise.
# The zip is what installed apps update from.
mac:
  icon: build/icon.png
  category: public.app-category.graphics-design
  target: [dmg, zip]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: Design-Clone-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  category: Graphics
  target: [AppImage, deb]
  maintainer: Sajid Mujawar
  executableName: design-clone
  synopsis: A design tool for interfaces and prototypes
  artifactName: Design-Clone-${version}-${arch}.${ext}
  mimeTypes: [application/x-design-clone]
deb:
  depends: [libnotify4, libxtst6, libnss3]

# Where installed apps look for updates: the latest GitHub release's latest.yml (GitHub redirects
# /releases/latest/download/<file> to the newest release). The release workflow uploads the files.
publish:
  provider: generic
  url: https://github.com/SajidMujawar03/designing-software/releases/latest/download
