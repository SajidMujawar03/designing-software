# Local services for Phase 7 (back end). Not needed for the Phase 1 editor.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: figma
      POSTGRES_PASSWORD: figma
      POSTGRES_DB: figma
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: figma
      MINIO_ROOT_PASSWORD: figmafigma
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
