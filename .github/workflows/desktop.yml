# Builds the desktop app for Windows, macOS and Linux, smoke-tests each packaged
# app, and for a tag like desktop-v0.2.0 publishes one GitHub Release with
# everything, including the latest*.yml files installed apps update from.
#   git tag desktop-v0.2.0 && git push origin desktop-v0.2.0
# Run it by hand (Actions > Desktop release > Run workflow) to just build and download them.
name: Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            builder: --win
          - os: macos-latest
            platform: mac
            builder: --mac --arm64 --x64
          - os: ubuntu-latest
            platform: linux
            builder: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "desktop-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json ($version)."
            exit 1
          fi

      - name: Build the web app
        run: pnpm --filter @figma/web build

      - name: Package
        shell: bash
        working-directory: apps/desktop
        run: node build.mjs && pnpm exec electron-builder ${{ matrix.builder }} --publish never
        env:
          # Optional: crash and error reports to Sentry.
          DESKTOP_SENTRY_DSN: ${{ secrets.DESKTOP_SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Optional signing. Windows: a .pfx (base64) and password. macOS: a Developer ID .p12, plus
          # an Apple ID app-specific password and team id for notarization.
          CSC_LINK: ${{ matrix.platform == 'win' && secrets.WINDOWS_CERTIFICATE || matrix.platform == 'mac' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WINDOWS_CERTIFICATE_PASSWORD || matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Smoke-test the packaged app (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: '"apps/desktop/release/win-unpacked/Design Clone.exe" --smoke'
        env:
          SMOKE_OUT: ${{ github.workspace }}/smoke

      - name: Smoke-test the packaged app (macOS)
        if: matrix.platform == 'mac'
        run: '"apps/desktop/release/mac-arm64/Design Clone.app/Contents/MacOS/Design Clone" --smoke'
        env:
          SMOKE_OUT: ${{ github.workspace }}/smoke

      - name: Smoke-test the packaged app (Linux)
        if: matrix.platform == 'linux'
        run: |
          # Chromium's sandbox helper must be setuid root, and Ubuntu restricts the namespaces it uses.
          sudo chown root:root apps/desktop/release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 apps/desktop/release/linux-unpacked/chrome-sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a apps/desktop/release/linux-unpacked/design-clone --smoke
        env:
          SMOKE_OUT: ${{ github.workspace }}/smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.platform }}
          path: smoke/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: design-clone-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: design-clone-*
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#desktop-v}
          ls -la files
          cat > notes.md <<EOF
          **Windows:** Design-Clone-Setup-$version.exe installs it (or use the portable .exe).
          **macOS:** the .dmg for your Mac (arm64 for Apple silicon, x64 for Intel).
          **Linux:** the .AppImage, or the .deb for Debian and Ubuntu.

          Installed apps update themselves from this release. Builds without a signing certificate show a warning on first run (Windows: More info > Run anyway; macOS: right-click > Open).
          EOF
          gh release create "$GITHUB_REF_NAME" files/* --repo "$REPO" --title "Design Clone $version" --notes-file notes.md --verify-tag
